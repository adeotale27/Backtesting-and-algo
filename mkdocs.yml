site_name: UI Trading System
site_description: Self-hosted algorithmic options-trading dashboard for Zerodha Kite Connect
repo_url: https://github.com/Raahi-Bhushan/ui-trading-system
repo_name: Raahi-Bhushan/ui-trading-system

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Disclaimer: disclaimer.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Modules:
      - Positions & Greeks: modules/positions.md
      - Wave Extractor: modules/wave-extractor.md
      - Survivor: modules/survivor.md
      - Expiry Trade: modules/expiry-trade.md
      - Early Exit: modules/early-exit.md
      - GTT & Order Monitoring: modules/gtt-monitoring.md
      - Trade Journal: modules/trade-journal.md
      - Covered Calls: modules/covered-calls.md
      - Notifications: modules/notifications.md
  - Security: security.md
  - FAQ: faq.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
