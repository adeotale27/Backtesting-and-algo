<script>
/* CSRF shim: attaches X-CSRFToken to all same-origin mutating fetch/XHR
   requests. Token comes from /api/csrf-token (session-bound, no expiry).
   If that endpoint is absent (flask-wtf not installed), requests pass
   through unmodified — the server isn't enforcing CSRF in that case. */
(function () {
  if (window.__csrfShimInstalled) return;
  window.__csrfShimInstalled = true;

  var MUTATING = /^(POST|PUT|PATCH|DELETE)$/i;
  var tokenPromise = null;

  function isSameOrigin(url) {
    if (!url) return true;
    url = String(url);
    if (url.indexOf('//') === -1) return true;           // relative
    return url.indexOf(location.origin + '/') === 0 || url === location.origin;
  }

  function getToken() {
    if (!tokenPromise) {
      tokenPromise = window.__origFetchForCsrf('/api/csrf-token', { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var t = d && d.csrf_token ? d.csrf_token : null;
          window.__CSRF_TOKEN_CACHE = t;                  // sync cache for XHR
          return t;
        })
        .catch(function () { return null; });
    }
    return tokenPromise;
  }

  window.__origFetchForCsrf = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var method = (init && init.method) || (input && input.method) || 'GET';
    var url = (typeof input === 'string') ? input : (input && input.url);
    if (!MUTATING.test(method) || !isSameOrigin(url)) {
      return window.__origFetchForCsrf(input, init);
    }
    return getToken().then(function (token) {
      if (!token) return window.__origFetchForCsrf(input, init);
      init = init || {};
      var headers = new Headers(init.headers || (typeof input !== 'string' && input && input.headers) || {});
      headers.set('X-CSRFToken', token);
      init.headers = headers;
      return window.__origFetchForCsrf(input, init);
    });
  };

  var origOpen = XMLHttpRequest.prototype.open;
  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__csrfNeeded = MUTATING.test(method) && isSameOrigin(url);
    return origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    if (this.__csrfNeeded && window.__CSRF_TOKEN_CACHE) {
      try { this.setRequestHeader('X-CSRFToken', window.__CSRF_TOKEN_CACHE); } catch (e) { /* already sent */ }
    }
    return origSend.apply(this, arguments);
  };

  getToken();  // warm the cache immediately so XHR callers have it too
})();
</script>
