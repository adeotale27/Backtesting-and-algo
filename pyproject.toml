[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-trading-system"
version = "1.0.0"
description = "Self-hosted algorithmic options-trading dashboard and library for Zerodha Kite Connect (NIFTY/SENSEX)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Raahi Bhushan" }]
keywords = ["trading", "zerodha", "kiteconnect", "options", "nifty", "sensex", "algotrading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "kiteconnect>=5.0",
]

[project.urls]
Homepage = "https://github.com/Raahi-Bhushan/ui-trading-system"
Issues = "https://github.com/Raahi-Bhushan/ui-trading-system/issues"

# The core trading primitives install as flat top-level modules (the same
# names the dashboard uses). `pip install .` gives you the library without
# running the Flask app; the full dashboard remains clone-and-run.
[tool.setuptools]
py-modules = [
    "common_lib",
    "positions_lib",
    "sensex_positions_lib",
    "instrument_cache",
    "greeks_lib",
    "kite_api_monitor",
    "gtt_monitor",
    "duplicate_order_monitor",
    "early_exit_lib",
    "early_exit_sensex_lib",
    "expiry_trade_lib",
    "trade_journal",
    "trade_journal_db",
    "tradebook_analyzer",
]
packages = ["mibian"]
