name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Create dummy config for import-time reads
        run: |
          cp configfile.ini.example configfile.ini
          sed -i 's/YOUR_API_KEY/ciapikey12345678/; s/YOUR_API_SECRET/ciapisecret12345/; s/YOUR_USERNAME/ci_user/; s/YOUR_PASSWORD/ci_password_123/' configfile.ini
      # The deselected tests are known-stale (assert against older internals)
      # and tracked for repair — see the FAQ. Everything else must pass.
      - name: Run tests
        run: >
          pytest tests/ -q
          --deselect tests/test_order_history.py::TestExtractSymbolInfo::test_extract_unknown_format
          --deselect tests/test_order_history.py::TestLoadWaveExtractorOrders::test_filters_wave_extractor_orders_only
          --deselect tests/test_theta_calc.py::test_theta_calculation
          --deselect tests/test_theta_calc.py::test_calendar_days_logic
          --deselect tests/test_trade_journal.py::TestGetJournalSummary::test_basic_summary
          --deselect tests/test_trade_journal.py::TestReconcileWithZerodha::test_adds_missing_manual_trade
          --deselect tests/test_trade_journal.py::TestReconcileWithZerodha::test_skips_already_recorded_by_order_id
          --deselect tests/test_trade_journal.py::TestReconcileWithZerodha::test_skips_already_recorded_by_fuzzy_match
          --deselect tests/test_watchdog.py::TestWatchdogSleep::test_resets_consecutive_reconnects_on_fresh_tick
