<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAS Expiry — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0c1210;
      --bg1: #14201a;
      --ink: #e7f0ea;
      --muted: #8aa396;
      --accent: #c4f542;
      --danger: #ff6b4a;
      --line: rgba(196, 245, 66, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "IBM Plex Sans", sans-serif; color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1c3a2c 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #2a1f0a 0%, transparent 50%),
        var(--bg0);
    }
    .card {
      width: min(420px, 92vw); padding: 2rem 1.75rem;
      background: linear-gradient(160deg, var(--bg1), #0e1612);
      border: 1px solid var(--line); border-radius: 4px;
    }
    h1 {
      margin: 0 0 .25rem; font-size: 1.35rem; letter-spacing: .04em;
      font-family: "IBM Plex Mono", monospace; color: var(--accent);
    }
    p { margin: 0 0 1.5rem; color: var(--muted); font-size: .92rem; }
    label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; }
    input {
      width: 100%; margin-bottom: 1rem; padding: .7rem .8rem;
      background: #0a100e; border: 1px solid var(--line); color: var(--ink);
      font-family: "IBM Plex Mono", monospace; border-radius: 2px;
    }
    button {
      width: 100%; padding: .8rem; border: 0; cursor: pointer;
      background: var(--accent); color: #0c1210; font-weight: 600;
      font-family: "IBM Plex Sans", sans-serif; letter-spacing: .03em;
    }
    .err { color: var(--danger); margin-bottom: 1rem; font-size: .9rem; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>CAS EXPIRY</h1>
    <p>Admin gate for the Closing Auction Session algo.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Enter</button>
  </form>
</body>
</html>
